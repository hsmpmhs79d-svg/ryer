<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>살구 CRM — 가입 관리</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:#fdf8f3; color:#1e293b; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 28px 16px 80px; }
  header { display:flex; align-items:center; justify-content:space-between; padding-bottom:16px; border-bottom:3px solid #e8833a; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
  header h1 { font-size:21px; color:#7c2d12; }
  header .me { font-size:13px; color:#64748b; }
  .btn { border:none; border-radius:8px; padding:9px 16px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
  .btn-g { background:#fff; border:1.5px solid #cbd5e1; color:#334155; }
  .btn-blue { background:#2563eb; color:#fff; }
  .btn-green { background:#16a34a; color:#fff; }
  .btn-red { background:#ef4444; color:#fff; }
  .btn-sm { padding:6px 12px; font-size:13px; border-radius:6px; }
  .tabs { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .tab { padding:8px 16px; border-radius:20px; font-size:14px; font-weight:700; cursor:pointer; background:#fff; border:1.5px solid #e2e8f0; color:#64748b; }
  .tab.on { background:#7c2d12; color:#fff; border-color:#7c2d12; }
  .tab .n { font-weight:900; margin-left:4px; }
  .card { background:#fff; border:1px solid #f0e4d6; border-radius:12px; padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .card .info { flex:1; min-width:220px; }
  .card .name { font-size:16px; font-weight:800; color:#0f172a; }
  .card .sub { font-size:13px; color:#64748b; margin-top:3px; word-break:break-all; }
  .card .memo { font-size:12.5px; color:#a06a42; margin-top:3px; }
  .badge { font-size:11.5px; font-weight:800; padding:3px 9px; border-radius:10px; }
  .b-pending { background:#fef3c7; color:#b45309; }
  .b-paid { background:#fff7ed; color:#c2410c; border:1.5px solid #fdba74; }
  .b-existing { background:#e0f2fe; color:#0369a1; }
  .b-approved { background:#dcfce7; color:#15803d; }
  .b-rejected { background:#fee2e2; color:#b91c1c; }
  .b-expired { background:#f1f5f9; color:#64748b; }
  /* ★ 2026-09-23: 무료체험 */
  .b-trialreq { background:#f0fdf4; color:#15803d; border:1.5px solid #86efac; }
  .b-trial { background:#16a34a; color:#fff; }
  .b-plan { background:#fffbeb; color:#b45309; border:1.5px solid #fcd34d; }
  .acts { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  /* ★ 일괄 적용 (2026-09-18) */
  .bulkbar { background:#fff; border:1.5px solid #f0e4d6; border-radius:12px; padding:10px 14px; margin-bottom:12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:13.5px; color:#475569; }
  .bulkbar select, .bulkbar input[type=date] { padding:6px 8px; border:1.5px solid #cbd5e1; border-radius:6px; font-size:13px; font-family:inherit; }
  .bulkbar .cnt { font-weight:800; color:#7c2d12; }
  .card .sg-ck { width:18px; height:18px; cursor:pointer; flex-shrink:0; }
  .acts input[type=date] { padding:6px 8px; border:1.5px solid #cbd5e1; border-radius:6px; font-size:13px; font-family:inherit; }
  .empty { text-align:center; color:#94a3b8; padding:40px 0; font-size:14.5px; }
  #login-box { text-align:center; padding:70px 20px; }
  #login-box .peach { font-size:56px; }
  #login-box h2 { color:#7c2d12; margin:10px 0 6px; }
  #login-box p { color:#64748b; font-size:14px; margin-bottom:22px; }
  .addbox { background:#fff6ed; border:1.5px solid #f5d9bd; border-radius:12px; padding:14px 16px; margin-bottom:18px; }
  .addbox b { color:#7c2d12; font-size:14px; }
  .addrow { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .addrow input { padding:8px 11px; border:1.5px solid #cbd5e1; border-radius:8px; font-size:14px; font-family:inherit; flex:1; min-width:140px; }
  /* ★ 걸러보기 줄 (2026-09-02) */
  .filters { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .filters input, .filters select { padding:8px 11px; border:1.5px solid #e2e8f0; border-radius:8px; font-size:13.5px; font-family:inherit; background:#fff; color:#334155; }
  .filters input { flex:1; min-width:190px; }
  .summary { background:#fff; border:1.5px solid #f0e4d6; border-radius:12px; padding:11px 16px; margin-bottom:12px; font-size:13.5px; color:#475569; display:flex; gap:14px; flex-wrap:wrap; }
  .summary b { color:#7c2d12; font-size:15px; }
  .b-invited { background:#ecfdf5; color:#047857; border:1.5px solid #a7f3d0; }
  .usage { font-size:12.5px; color:#475569; margin-top:3px; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#0f172a; color:#fff; padding:11px 22px; border-radius:10px; font-size:14px; display:none; z-index:99; }
</style>
</head>
<body>
<div class="wrap">

  <div id="login-box">
    <div class="peach">🍑</div>
    <h2>살구 CRM 가입 관리</h2>
    <p>관리자(팀장 여상현)만 접근할 수 있습니다.</p>
    <button class="btn btn-blue" onclick="doLogin()">Google로 관리자 로그인</button>
  </div>

  <div id="main" style="display:none;">
    <header>
      <h1>🍑 살구 가입 관리</h1>
      <div style="display:flex;gap:10px;align-items:center;">
        <span class="me" id="me"></span>
        <button class="btn btn-g btn-sm" onclick="dlExcel()">📥 엑셀 저장</button>
        <button class="btn btn-g btn-sm" onclick="load()">↻ 새로고침</button>
      </div>
    </header>

    <div class="addbox">
      <b>➕ 직접 등록 (즉시 승인)</b> — 기존 사용자를 명단에 넣거나, 급하게 승인할 때
      <div class="addrow">
        <input id="a-email" placeholder="이메일 (필수)">
        <input id="a-name" placeholder="이름">
        <input id="a-phone" placeholder="전화번호">
        <input id="a-memo" placeholder="메모 (입금자명 등)">
        <button class="btn btn-green" onclick="addUser()">등록</button>
      </div>
    </div>

    <div class="summary" id="summary"></div>
    <div class="filters" id="filters"></div>
    <div class="tabs" id="tabs"></div>
    <div id="list"></div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
var API = 'https://salgu-api.wmmryer.workers.dev';
var CLIENT_ID = '491677189712-agtga4sn5ed3gje4n0lk02veoj3ttl2c.apps.googleusercontent.com';
var _token = null, _users = [], _tab = 'pending', _tc = null;
var ADMIN_FIXED = ['wmmryer@gmail.com', 'ryersang@gmail.com'];   /* 워커 코드에 박힌 기본 관리자 — 해제 불가 */
function isAdminU(u) { var e = String(u.email || '').toLowerCase(); return ADMIN_FIXED.indexOf(e) >= 0 || Number(u.is_admin) === 1; }
var _sel = {};   /* ★ 일괄 적용용 체크 상태 (이메일 → true) (2026-09-18) */
/* ★ 걸러보기·정렬 상태 (2026-09-02) */
var _q = '', _grp = 'all', _mon = 'all', _sort = 'seen', _view = 'all', _fbuilt = false;

function toast(m) {
  var t = document.getElementById('toast');
  t.textContent = m; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(function(){ t.style.display='none'; }, 2200);
}

function doLogin() {
  if (!window.google || !google.accounts) { toast('구글 모듈 로딩 중… 잠시 후 다시 눌러주세요'); return; }
  if (!_tc) {
    _tc = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/userinfo.email',
      callback: function(resp) {
        if (resp && resp.access_token) { _token = resp.access_token; afterLogin(); }
      }
    });
  }
  _tc.requestAccessToken({ prompt: '' });
}

function api(path, opt) {
  opt = opt || {};
  opt.headers = Object.assign({ 'Authorization': 'Bearer ' + _token, 'Content-Type': 'application/json' }, opt.headers || {});
  return fetch(API + path, opt).then(function(r){ return r.json(); });
}

function afterLogin() {
  api('/admin/list').then(function(r) {
    if (!r.ok) { toast(r.error === '권한 없음' ? '⛔ 관리자 계정이 아닙니다' : '오류: ' + (r.error||'')); return; }
    document.getElementById('login-box').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    _users = r.users || [];
    render();
  }).catch(function(){ toast('서버 연결 실패'); });
}

function load() {
  api('/admin/list').then(function(r) {
    if (r.ok) { _users = r.users || []; render(); toast('갱신됨'); }
  });
}

function statusOf(u) {
  /* ★ 2026-09-23: 무료체험 — status='trial' 이면 체험 중, 기간이 지나면 만료로 본다 */
  if (u.status === 'trial') {
    var todayT = new Date(Date.now() + 9*3600*1000).toISOString().slice(0,10);
    if (!u.expires_at || u.expires_at < todayT) return 'expired';
    return 'trial';
  }
  if (u.status === 'pending' && String(u.trial_state || '') === 'req') return 'trialreq';
  if (u.status === 'approved' && u.expires_at) {
    var today = new Date(Date.now() + 9*3600*1000).toISOString().slice(0,10);
    if (u.expires_at < today) return 'expired';
  }
  /* 입금 완료를 신고한 대기자를 맨 앞 탭으로 (2026-08-24) */
  if (u.status === 'pending' && /💰입금완료 신고/.test(u.memo || '')) return 'paid';
  /* 자동 수집된 기존 사용자는 대기와 분리해서 별도 탭으로 (2026-08-10) */
  if (u.status === 'pending' && /자동 수집/.test(u.memo || '')) return 'existing';
  return u.status;
}
var LBL = { all:'📋 전체', trialreq:'🎁 체험 신청', trial:'🧪 체험 중', paid:'💰 입금확인 대기', pending:'⏳ 대기', existing:'👥 기존 사용자', approved:'✅ 승인', rejected:'🚫 거절', expired:'⌛ 만료' };
var CLS = { all:'b-existing', trialreq:'b-trialreq', trial:'b-trial', paid:'b-paid', pending:'b-pending', existing:'b-existing', approved:'b-approved', rejected:'b-rejected', expired:'b-expired' };
/* ★ 전체 탭 (2026-09-02) — 기존 사용자 + 승인, 즉 지금 살구를 쓰고 있는 사람 전부 */
function inTab(u, t) {
  var s0 = statusOf(u);
  if (t === 'all') return s0 === 'existing' || s0 === 'approved' || s0 === 'trial';
  return s0 === t;
}

function renderSummary() {
  var n = _users.length, inv = 0, appr = 0, hot = 0, idle = 0, never = 0, soon = 0, tri = 0;
  _users.forEach(function(u){
    if (isInvited(u)) inv++;
    var _s = statusOf(u);
    if (_s === 'approved') appr++;
    if (_s === 'trial') tri++;                      /* ★ 2026-09-23 */
    var d = seenDays(u);
    if (d === null) never++; else if (d <= 7) hot++; else if (d >= 30) idle++;
    var x = daysToExpire(u); if (x !== null && x >= 0 && x <= 30) soon++;
  });
  document.getElementById('summary').innerHTML =
      '<span>전체 <b>' + n + '</b>명</span>'
    + '<span>✅ 승인 <b>' + appr + '</b></span>'
    + '<span>🧪 체험 중 <b>' + tri + '</b></span>'
    + '<span>🌱 초대 멤버 <b>' + inv + '</b></span>'
    + '<span>🔥 이번 주 접속 <b>' + hot + '</b></span>'
    + '<span>😴 휴면 <b>' + idle + '</b></span>'
    + '<span>🚫 미접속 <b>' + never + '</b></span>'
    + '<span>⏰ 만료 임박 <b>' + soon + '</b></span>';
}

function render() {
  if (!_fbuilt) buildFilters();
  renderSummary();
  fillMonths();
  var base = _users.filter(passFilter);
  var counts = { all:0, trialreq:0, trial:0, paid:0, pending:0, existing:0, approved:0, rejected:0, expired:0 };
  base.forEach(function(u){
    var s0 = statusOf(u);
    counts[s0] = (counts[s0]||0)+1;
    if (s0 === 'existing' || s0 === 'approved' || s0 === 'trial') counts.all++;   /* ★ 전체 = 지금 쓰고 있는 사람 (2026-09-02 / 체험 포함 2026-09-23) */
  });
  var tabs = ['all','trialreq','trial','paid','pending','existing','approved','expired','rejected'];
  document.getElementById('tabs').innerHTML = tabs.map(function(t){
    return '<div class="tab' + (_tab===t?' on':'') + '" onclick="_tab=\'' + t + '\';render()">' + LBL[t] + '<span class="n">' + (counts[t]||0) + '</span></div>';
  }).join('');

  var rows = sortRows(base.filter(function(u){ return inTab(u, _tab); }));
  if (!rows.length) { document.getElementById('list').innerHTML = '<div class="empty">해당하는 사람이 없습니다</div>'; return; }
  document.getElementById('list').innerHTML = (_tab !== 'all' ? bulkBarHtml(rows) : '') + rows.map(function(u) {
    var st = statusOf(u);
    var acts = '';
    /* ★ 전체 탭은 '누가 어떻게 쓰나' 보는 곳 — 버튼 없이 명단만 (2026-09-02).
       승인·이용중지는 각 상태 탭에서 한다. */
    if (_tab !== 'all') {
      /* ★ 2026-09-23: 체험 신청 — 한 번 눌러 5일 열어주기 (일수는 고칠 수 있다) */
      if (st === 'trialreq') {
        acts += '<input type="number" id="td-' + esc(u.email) + '" value="5" min="1" max="60" style="width:56px" title="체험 일수">'
             + '<button class="btn btn-sm" style="background:#16a34a;color:#fff;border:none" onclick="approveTrial(\'' + esc(u.email) + '\')">🎁 체험 열기</button>';
      }
      /* ★ 체험 중 — 정식 전환은 아래 승인 버튼, 중단은 이용 중지 */
      if (st === 'trial') {
        acts += '<button class="btn btn-g btn-sm" onclick="reject(\'' + esc(u.email) + '\')">체험 중단</button>';
      }
      if (st === 'trial' || st === 'paid' || st === 'pending' || st === 'existing' || st === 'rejected' || st === 'expired') {
        acts += '<input type="date" id="exp-' + esc(u.email) + '" value="' + planExpiry(u) + '" title="만료일 — 고른 요금제대로 미리 채워둠 (비우면 무기한)">'
             + '<button class="btn btn-green btn-sm" onclick="approve(\'' + esc(u.email) + '\')">승인</button>';
      }
      if (st === 'paid' || st === 'pending') {
        acts += '<button class="btn btn-red btn-sm" onclick="reject(\'' + esc(u.email) + '\')">거절</button>';
      }
      if (st === 'approved') {
        /* ★ 2026-09-18: 이미 승인된 사람의 기간 바꾸기 — 날짜 고쳐서 [기간 변경], 또는 [무기한] */
        var pk0 = planOf(u);
        acts += '<select id="plan-' + esc(u.email) + '" title="요금제 변경" onchange="planPick(\'' + esc(u.email) + '\')">'
             +   '<option value=""' + (pk0 ? '' : ' selected') + '>요금제 없음</option>'
             +   Object.keys(PLAN).map(function(k){ return '<option value="' + k + '"' + (k === pk0 ? ' selected' : '') + '>' + PLAN[k].label + ' · ' + PLAN[k].price.toLocaleString() + '원</option>'; }).join('')
             + '</select>'
             + '<input type="date" id="exp-' + esc(u.email) + '" value="' + esc(u.expires_at || '') + '" title="만료일 (비우면 무기한)">'
             + '<button class="btn btn-green btn-sm" onclick="setPlan(\'' + esc(u.email) + '\')">적용</button>'
             + '<button class="btn btn-sm" style="background:#ecfdf5;color:#15803d;border:1.5px solid #86efac" onclick="setUnlimited(\'' + esc(u.email) + '\')">♾ 무기한</button>'
             + '<button class="btn btn-g btn-sm" onclick="reject(\'' + esc(u.email) + '\')">이용 중지</button>';
      }
      /* 초대 멤버 표시를 손으로 켜고 끄기 — 잘못 잡힌 사람 바로잡을 때 */
      /* ★ 관리자 지정/해제 (2026-09-18) — 기본 관리자는 버튼 없음 */
      if (ADMIN_FIXED.indexOf(String(u.email || '').toLowerCase()) < 0) {
        acts += '<button class="btn btn-g btn-sm" title="관리자 페이지 접근 권한 주기/뺏기" onclick="setAdmin(\'' + esc(u.email) + '\',' + (isAdminU(u) ? 'false' : 'true') + ')">'
             + (isAdminU(u) ? '👑 관리자 해제' : '👑 관리자 지정') + '</button>';
      }
      acts += '<button class="btn btn-g btn-sm" title="초대 멤버 표시 켜기/끄기" onclick="setTier(\'' + esc(u.email) + '\',' + (isInvited(u) ? 'false' : 'true') + ')">'
           + (isInvited(u) ? '🌱 해제' : '🌱 초대') + '</button>';
    }
    return '<div class="card">'
      + (_tab !== 'all' ? '<input type="checkbox" class="sg-ck" title="일괄 적용 대상으로 선택" value="' + esc(u.email) + '"' + (_sel[String(u.email).toLowerCase()] ? ' checked' : '') + ' onchange="bulkTick(this)">' : '')
      + '<div class="info">'
      +   '<div class="name">' + esc(u.name || '(이름 없음)') + ' <span class="badge ' + CLS[st] + '">' + LBL[st] + '</span>'
      +     (isInvited(u) ? ' <span class="badge b-invited">🌱 초대 멤버</span>' : '') + (isAdminU(u) ? ' <span class="badge" style="background:#fef3c7;color:#92400e;border:1.5px solid #fcd34d">👑 관리자</span>' : '') + planHtml(u) + '</div>'
      +   '<div class="sub">' + esc(u.email) + (u.phone ? ' · ' + esc(u.phone) : '') + '</div>'
      +   '<div class="sub">신청 ' + esc((u.created_at||'').slice(0,16)) + (u.approved_at ? ' · 승인 ' + esc(u.approved_at.slice(0,16)) : '') + (u.expires_at ? ' · <b style="color:#b45309">만료 ' + esc(u.expires_at) + '</b>' : (st === 'approved' ? ' · <b style="color:#15803d">♾ 무기한</b>' : '')) + '</div>'
      +   '<div class="usage">' + usageHtml(u) + '</div>'
      +   (u.memo ? '<div class="memo">📝 ' + esc(u.memo) + '</div>' : '')
      + '</div>'
      + '<div class="acts">' + acts + '</div>'
      + '</div>';
  }).join('');
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

/* ★ 초대 멤버 (2026-09-02) — 살구를 이미 쓰고 있어서 자동으로 명단에 담긴 사람들.
   1순위는 전용 칸 tier='invited' (재신청·입금신고로 memo 가 바뀌어도 안 지워짐).
   2순위는 옛날 memo 표시 — tier 백필 전 데이터를 위한 안전망. */
function isInvited(u) {
  if (String(u.tier || '') === 'invited') return true;
  return /자동 수집/.test(u.memo || '');
}

/* ★ 요금제 (2026-09-02) — 값은 워커·본체와 맞춰져 있음 */
var PLAN = {
  '6m': { label:'6개월', months:6,  price:29000 },
  '1y': { label:'1년',   months:12, price:49000 },
  '2y': { label:'2년',   months:24, price:89000 }
};
function planOf(u) { return PLAN[String(u.plan || '')] ? String(u.plan) : ''; }
function planHtml(u) {
  var k = planOf(u); if (!k) return '';
  var p = PLAN[k];
  return ' <span class="badge b-plan">' + p.label + ' · ' + p.price.toLocaleString() + '원</span>';
}
/* 오늘부터 요금제 기간만큼 뒤 (만료일 기본값). 요금제가 없으면 빈 값 = 무기한 */
function planExpiry(u) {
  var k = planOf(u); if (!k) return '';
  var d = new Date(Date.now() + 9*3600*1000);
  d.setMonth(d.getMonth() + PLAN[k].months);
  return d.toISOString().slice(0, 10);
}
/* 승인 월 ('2026-08') · 승인 전이면 'none' */
function apprMonth(u) { var a = String(u.approved_at || '').trim(); return a ? a.slice(0, 7) : 'none'; }
function activeDays(u) { var n = parseInt(u.active_days, 10); return isNaN(n) ? 0 : n; }

/* ★ 걸러보기 줄 (2026-09-02) */
function buildFilters() {
  document.getElementById('filters').innerHTML =
      '<input id="f-q" placeholder="🔍 이름 · 이메일 · 전화 검색" value="' + esc(_q) + '" oninput="_q=this.value;render()">'
    + '<select id="f-grp" onchange="_grp=this.value;render()">'
    +   '<option value="all">구분 — 전체</option>'
    +   '<option value="inv">🌱 초대 멤버만</option>'
    +   '<option value="new">🆕 그 외(신규)만</option>'
    + '</select>'
    + '<select id="f-view" onchange="_view=this.value;render()">'
    +   '<option value="all">보기 — 전체</option>'
    +   '<option value="hot">🔥 이번 주 접속한 사람</option>'
    +   '<option value="idle">😴 휴면 (30일 이상 안 들어옴)</option>'
    +   '<option value="never">🚫 한 번도 안 들어옴</option>'
    +   '<option value="soon">⏰ 만료 임박 (30일 이내)</option>'
    + '</select>'
    + '<select id="f-mon" onchange="_mon=this.value;render()"></select>'
    + '<select id="f-sort" onchange="_sort=this.value;render()">'
    +   '<option value="seen">정렬 — 최근 접속 순</option>'
    +   '<option value="idle">정렬 — 오래 안 들어온 순</option>'
    +   '<option value="days">정렬 — 많이 쓴 순</option>'
    +   '<option value="appr">정렬 — 승인일 최신 순</option>'
    +   '<option value="reg">정렬 — 신청일 최신 순</option>'
    +   '<option value="name">정렬 — 이름 순</option>'
    + '</select>';
  document.getElementById('f-grp').value = _grp;
  document.getElementById('f-sort').value = _sort;
  document.getElementById('f-view').value = _view;
  _fbuilt = true;
}
/* 승인 월 목록은 명단이 바뀔 때만 다시 만든다 */
function fillMonths() {
  var sel = document.getElementById('f-mon');
  if (!sel) return;
  var cnt = {};
  _users.forEach(function(u){ var m = apprMonth(u); cnt[m] = (cnt[m]||0) + 1; });
  var months = Object.keys(cnt).filter(function(m){ return m !== 'none'; }).sort().reverse();
  var html = '<option value="all">승인월 — 전체</option>';
  var asc = months.slice().reverse();   /* 오래된 달이 1기 */
  months.forEach(function(m){
    var gi = asc.indexOf(m) + 1;
    html += '<option value="' + m + '">' + gi + '기 · ' + m.replace('-', '년 ') + '월 (' + cnt[m] + ')</option>';
  });
  if (cnt['none']) html += '<option value="none">아직 승인 전 (' + cnt['none'] + ')</option>';
  if (sel.getAttribute('data-sig') !== html.length + ':' + months.join()) {
    sel.innerHTML = html;
    sel.setAttribute('data-sig', html.length + ':' + months.join());
  }
  sel.value = _mon;
  if (!sel.value) { _mon = 'all'; sel.value = 'all'; }
}
/* 만료까지 남은 날 (만료일 없으면 null) */
function daysToExpire(u) {
  var e = String(u.expires_at || '').trim();
  if (!e) return null;
  var t = Date.parse(e + 'T00:00:00Z');
  if (isNaN(t)) return null;
  return Math.ceil((t - (Date.now() + 9 * 3600 * 1000)) / 86400000);
}
function passFilter(u) {
  if (_grp === 'inv' && !isInvited(u)) return false;
  if (_grp === 'new' && isInvited(u)) return false;
  if (_view !== 'all') {
    var d = seenDays(u);
    if (_view === 'hot'   && !(d !== null && d <= 7)) return false;
    if (_view === 'idle'  && !(d !== null && d >= 30)) return false;
    if (_view === 'never' && d !== null) return false;
    if (_view === 'soon') { var x = daysToExpire(u); if (x === null || x < 0 || x > 30) return false; }
  }
  if (_mon !== 'all' && apprMonth(u) !== _mon) return false;
  var q = _q.trim().toLowerCase();
  if (q) {
    var hay = ((u.name||'') + ' ' + (u.email||'') + ' ' + (u.phone||'') + ' ' + (u.memo||'')).toLowerCase();
    if (hay.indexOf(q) === -1) return false;
  }
  return true;
}
function sortRows(rows) {
  var r = rows.slice();
  function seen(u){ return String(u.last_seen || ''); }
  if (_sort === 'seen')      r.sort(function(a,b){ return seen(b).localeCompare(seen(a)); });
  else if (_sort === 'idle') r.sort(function(a,b){ return seen(a).localeCompare(seen(b)); });  /* 기록 없음이 맨 앞 */
  else if (_sort === 'days') r.sort(function(a,b){ return activeDays(b) - activeDays(a); });
  else if (_sort === 'appr') r.sort(function(a,b){ return String(b.approved_at||'').localeCompare(String(a.approved_at||'')); });
  else if (_sort === 'reg')  r.sort(function(a,b){ return String(b.created_at||'').localeCompare(String(a.created_at||'')); });
  else if (_sort === 'name') r.sort(function(a,b){ return String(a.name||'힣').localeCompare(String(b.name||'힣'), 'ko'); });
  return r;
}

/* ★ 최근 접속 (2026-09-02) — 서버가 /check 때 남긴 last_seen (한국 시간) */
function seenText(u) {
  var s = String(u.last_seen || '').trim();
  if (!s) return '';
  return s.slice(0, 16).replace('T', ' ');
}
function seenDays(u) {
  var s = String(u.last_seen || '').trim();
  if (!s) return null;
  var t = Date.parse(s.replace(' ', 'T').slice(0, 19) + 'Z');
  if (isNaN(t)) return null;
  return Math.floor((Date.now() + 9 * 3600 * 1000 - t) / 86400000);
}
function seenHtml(u) {
  var txt = seenText(u);
  if (!txt) return '<span style="color:#9ca3af">최근 접속 기록 없음</span>';
  var d = seenDays(u);
  var ago = (d === null) ? '' : (d <= 0 ? ' (오늘)' : (d === 1 ? ' (어제)' : ' (' + d + '일 전)'));
  var col = (d !== null && d >= 30) ? '#b45309' : '#0f766e';
  return '최근 접속 <b style="color:' + col + '">' + esc(txt) + ago + '</b>';
}
/* 최근 접속 + 실제로 쓴 날 수 + 첫 접속 — 한 줄로 */
function usageHtml(u) {
  var parts = [seenHtml(u)];
  var n = activeDays(u);
  if (n) parts.push('사용 <b>' + n + '일</b>');
  var f = String(u.first_seen || '').slice(0, 10);
  if (f) parts.push('첫 접속 ' + esc(f));
  var c = parseInt(u.cust_count, 10);
  if (!isNaN(c)) parts.push('고객 <b>' + c + '명</b>' + (u.device === 'M' ? ' 📱' : (u.device === 'P' ? ' 💻' : '')));
  return parts.join(' · ');
}

/* 현재 보고 있는 탭의 명단을 엑셀(CSV)로 저장 (2026-08-10) */
function dlExcel() {
  var rows = sortRows(_users.filter(passFilter).filter(function(u){ return inTab(u, _tab); }));
  if (!rows.length) { toast('이 탭에는 저장할 명단이 없습니다'); return; }
  var head = ['이름','이메일','전화번호','구분','요금제','금액','상태','만료일','신청일','승인일','승인월','최근접속','사용일수','첫접속','고객수','기기','메모'];
  var LBL2 = { all:'전체', paid:'입금확인 대기', pending:'대기', existing:'기존 사용자', approved:'승인', rejected:'거절', expired:'만료' };
  function cell(v){ v = String(v==null?'':v); return '"' + v.replace(/"/g,'""') + '"'; }
  var lines = [head.map(cell).join(',')];
  rows.forEach(function(u){
    var _pk = planOf(u);
    lines.push([u.name||'', u.email||'', u.phone||'', isInvited(u)?'초대 멤버':'신규',
      _pk?PLAN[_pk].label:'', _pk?PLAN[_pk].price:'', LBL2[statusOf(u)]||u.status||'',
      u.expires_at||'', (u.created_at||'').slice(0,16), (u.approved_at||'').slice(0,16),
      apprMonth(u)==='none'?'':apprMonth(u), seenText(u), activeDays(u)||'', String(u.first_seen||'').slice(0,10),
      (u.cust_count==null?'':u.cust_count), (u.device==='M'?'모바일':(u.device==='P'?'PC':'')),
      u.memo||''].map(cell).join(','));
  });
  var today = new Date(Date.now() + 9*3600*1000).toISOString().slice(0,10);
  var blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type:'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '살구_' + (LBL2[_tab]||_tab) + '_명단_' + today + '.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('📥 ' + rows.length + '명 저장됨');
}

function approve(email) {
  var expEl = document.getElementById('exp-' + email);
  var exp = expEl && expEl.value ? expEl.value : null;
  var u0 = null;
  for (var i = 0; i < _users.length; i++) if (String(_users[i].email).toLowerCase() === String(email).toLowerCase()) { u0 = _users[i]; break; }
  var pk = u0 ? planOf(u0) : '';
  var pTxt = pk ? ('\n요금제: ' + PLAN[pk].label + ' · ' + PLAN[pk].price.toLocaleString() + '원') : '';
  if (!confirm(email + ' 님을 승인할까요?' + pTxt + (exp ? '\n만료일: ' + exp : '\n(만료일 없음 — 무기한)'))) return;
  api('/admin/approve', { method:'POST', body: JSON.stringify({ email: email, expires_at: exp }) })
    .then(function(r){ if (r.ok) { toast('✅ 승인됨'); load(); } else toast('실패: ' + (r.error||'')); });
}
/* ★ 2026-09-23: 무료체험 열어주기 — 오늘부터 N일 (기본 5일) */
function approveTrial(email) {
  var dEl = document.getElementById('td-' + email);
  var days = dEl && dEl.value ? parseInt(dEl.value, 10) : 5;
  if (isNaN(days) || days < 1 || days > 60) days = 5;
  if (!confirm(email + ' 님에게 ' + days + '일 무료체험을 열어줄까요?\n\n체험 중에는 고객 10명까지 등록되고\n상담자료·퀵메시지 등 일부 기능이 잠깁니다.')) return;
  api('/admin/trial', { method:'POST', body: JSON.stringify({ email: email, days: days }) })
    .then(function(r){ if (r.ok) { toast('🎁 체험 열림 — ' + r.expires_at + ' 까지'); load(); } else toast('실패: ' + (r.error||'')); });
}

/* ★ 2026-09-18: 승인된 사람의 요금제·만료일 변경 — 워커 /admin/plan (승인 상태·승인 시각은 그대로) */
/* ★ 일괄 적용 (2026-09-18) — 체크한 사람들의 요금제·만료일·초대 표시를 한 번에 바꿈.
   워커 경로는 한 명씩 부르는 기존 것(/admin/plan, /admin/tier)을 순서대로 호출한다. */
function bulkBarHtml(rows) {
  var n = 0; rows.forEach(function(u){ if (_sel[String(u.email).toLowerCase()]) n++; });
  return '<div class="bulkbar">'
    + '<button class="btn btn-g btn-sm" onclick="bulkAll(true)">전체 선택</button>'
    + '<button class="btn btn-g btn-sm" onclick="bulkAll(false)">선택 해제</button>'
    + '<span>선택 <span class="cnt" id="bulk-cnt">' + n + '</span>명</span>'
    + '<span style="color:#cbd5e1">|</span>'
    + '<select id="bulk-plan" onchange="bulkPick()">'
    +   '<option value="__keep">요금제 그대로</option><option value="">요금제 없음</option>'
    +   Object.keys(PLAN).map(function(k){ return '<option value="' + k + '">' + PLAN[k].label + ' · ' + PLAN[k].price.toLocaleString() + '원</option>'; }).join('')
    + '</select>'
    + '<input type="date" id="bulk-exp" title="만료일 (비우면 무기한)">'
    + '<button class="btn btn-green btn-sm" onclick="bulkApply()">선택한 사람 적용</button>'
    + '<button class="btn btn-sm" style="background:#ecfdf5;color:#15803d;border:1.5px solid #86efac" onclick="bulkUnlimited()">♾ 무기한</button>'
    + '<button class="btn btn-g btn-sm" onclick="bulkTier(true)">🌱 초대</button>'
    + '<button class="btn btn-g btn-sm" onclick="bulkTier(false)">🌱 해제</button>'
    + '</div>';
}
function bulkTick(el) {
  var k = String(el.value).toLowerCase();
  if (el.checked) _sel[k] = true; else delete _sel[k];
  var c = document.getElementById('bulk-cnt'); if (c) c.textContent = document.querySelectorAll('.sg-ck:checked').length;
}
function bulkAll(on) {
  document.querySelectorAll('.sg-ck').forEach(function(el){ el.checked = on; bulkTick(el); });
}
function bulkPick() {
  var sel = document.getElementById('bulk-plan'), expEl = document.getElementById('bulk-exp');
  if (!sel || !expEl) return;
  if (sel.value === '__keep' || sel.value === '') expEl.value = '';
  else expEl.value = planExpiry({ plan: sel.value });
}
function bulkTargets() {
  var out = [];
  document.querySelectorAll('.sg-ck:checked').forEach(function(el){ out.push(el.value); });
  if (!out.length) toast('먼저 사람을 체크해 주세요');
  return out;
}
function bulkRun(emails, fn, label) {
  var ok = 0, bad = 0, i = 0;
  function next() {
    if (i >= emails.length) { _sel = {}; toast(label + ' 완료 · 성공 ' + ok + '명' + (bad ? ' · 실패 ' + bad + '명' : '')); load(); return; }
    fn(emails[i++]).then(function(r){ if (r && r.ok) ok++; else bad++; }, function(){ bad++; }).then(next);
  }
  next();
}
function bulkApply() {
  var emails = bulkTargets(); if (!emails.length) return;
  var sel = document.getElementById('bulk-plan'), expEl = document.getElementById('bulk-exp');
  var planSel = sel ? sel.value : '__keep', exp = expEl && expEl.value ? expEl.value : null;
  var pTxt = planSel === '__keep' ? '그대로' : (planSel ? PLAN[planSel].label + ' · ' + PLAN[planSel].price.toLocaleString() + '원' : '없음');
  if (!confirm(emails.length + '명을 한 번에 바꿀까요?\n요금제: ' + pTxt + '\n만료일: ' + (exp || '없음(무기한)'))) return;
  bulkRun(emails, function(email){
    var plan = planSel;
    if (plan === '__keep') { var u = null; for (var i = 0; i < _users.length; i++) if (String(_users[i].email).toLowerCase() === email.toLowerCase()) { u = _users[i]; break; } plan = u ? planOf(u) : ''; }
    return api('/admin/plan', { method:'POST', body: JSON.stringify({ email: email, plan: plan, expires_at: exp }) });
  }, '적용');
}
function bulkUnlimited() {
  var emails = bulkTargets(); if (!emails.length) return;
  if (!confirm(emails.length + '명을 기한 제한 없는 사용자(무기한)로 바꿀까요? (요금제는 그대로)')) return;
  bulkRun(emails, function(email){
    var u = null; for (var i = 0; i < _users.length; i++) if (String(_users[i].email).toLowerCase() === email.toLowerCase()) { u = _users[i]; break; }
    return api('/admin/plan', { method:'POST', body: JSON.stringify({ email: email, plan: u ? planOf(u) : '', expires_at: null }) });
  }, '무기한');
}
function bulkTier(on) {
  var emails = bulkTargets(); if (!emails.length) return;
  if (!confirm(emails.length + '명의 초대 멤버 표시를 ' + (on ? '켤까요?' : '끌까요?'))) return;
  bulkRun(emails, function(email){
    return api('/admin/tier', { method:'POST', body: JSON.stringify({ email: email, tier: on ? 'invited' : '' }) });
  }, on ? '초대 표시' : '초대 해제');
}
function _planPost(email, plan, exp, okMsg) {
  api('/admin/plan', { method:'POST', body: JSON.stringify({ email: email, plan: plan, expires_at: exp }) })
    .then(function(r){ if (r && r.ok) { toast(okMsg); load(); } else toast('실패: ' + ((r && r.error) || '워커에 /admin/plan 이 아직 없습니다')); });
}
/* 요금제를 고르면 만료일을 오늘 + 기간으로 미리 채움 (없음 → 비움) */
function planPick(email) {
  var sel = document.getElementById('plan-' + email), expEl = document.getElementById('exp-' + email);
  if (!sel || !expEl) return;
  expEl.value = sel.value ? planExpiry({ plan: sel.value }) : '';
}
function setPlan(email) {
  var sel = document.getElementById('plan-' + email), expEl = document.getElementById('exp-' + email);
  var plan = sel ? sel.value : '', exp = expEl && expEl.value ? expEl.value : null;
  var pTxt = plan ? (PLAN[plan].label + ' · ' + PLAN[plan].price.toLocaleString() + '원') : '요금제 없음';
  if (!confirm(email + ' 님을 이렇게 바꿀까요?\n요금제: ' + pTxt + '\n만료일: ' + (exp || '없음(무기한)'))) return;
  _planPost(email, plan, exp, '✅ 변경됨');
}
function setUnlimited(email) {
  var sel = document.getElementById('plan-' + email);
  if (!confirm(email + ' 님을 기한 제한 없는 사용자(무기한)로 바꿀까요?')) return;
  _planPost(email, sel ? sel.value : '', null, '♾ 무기한으로 변경됨');
}
/* ★ 관리자 지정/해제 (2026-09-18) — 지정된 사람은 살구 본체 상단에 [가입 관리] 버튼이 보이고 이 페이지에 들어올 수 있음 */
function setAdmin(email, on) {
  if (!confirm(email + (on ? ' 님을 관리자로 지정할까요?\n(이 가입 관리 페이지에 들어와 승인·중지·요금제를 바꿀 수 있게 됩니다)' : ' 님의 관리자 권한을 해제할까요?'))) return;
  api('/admin/setadmin', { method:'POST', body: JSON.stringify({ email: email, on: !!on }) })
    .then(function(r){ if (r && r.ok) { toast(on ? '👑 관리자로 지정됨' : '관리자 해제됨'); load(); } else toast('실패: ' + ((r && r.error) || '워커에 /admin/setadmin 이 아직 없습니다')); });
}
function setTier(email, on) {
  if (!confirm(email + (on ? ' 님을 초대 멤버로 표시할까요?' : ' 님의 초대 멤버 표시를 해제할까요?'))) return;
  api('/admin/tier', { method:'POST', body: JSON.stringify({ email: email, tier: on ? 'invited' : '' }) })
    .then(function(r){ if (r.ok) { toast('처리됨'); load(); } else toast('실패: ' + (r.error||'')); });
}
function reject(email) {
  if (!confirm(email + ' 님의 이용을 중지(거절)할까요?')) return;
  api('/admin/reject', { method:'POST', body: JSON.stringify({ email: email }) })
    .then(function(r){ if (r.ok) { toast('처리됨'); load(); } else toast('실패: ' + (r.error||'')); });
}
function addUser() {
  var email = document.getElementById('a-email').value.trim();
  if (!email) { toast('이메일을 입력하세요'); return; }
  api('/admin/add', { method:'POST', body: JSON.stringify({
    email: email,
    name: document.getElementById('a-name').value.trim(),
    phone: document.getElementById('a-phone').value.trim(),

  }) }).then(function(r){
    if (r.ok) { toast('✅ 등록·승인됨'); ['a-email','a-name','a-phone','a-memo'].forEach(function(i){ document.getElementById(i).value=''; }); load(); }
    else toast('실패: ' + (r.error||''));
  });
}
